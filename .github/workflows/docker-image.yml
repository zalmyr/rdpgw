name: Docker Image CI

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]

jobs:

  build:

    runs-on: ubuntu-latest

    env:
      # forks without Docker Hub credentials still build the image, they
      # just don't log in or push
      PUSH: ${{ secrets.DOCKER_USER != '' && secrets.DOCKER_PASSWORD != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
         username: ${{ secrets.DOCKER_USER }}
         password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push - latest
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dev/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ github.repository_owner }}/rdpgw:latest
      - name: Build and push - latest
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dev/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ github.repository_owner }}/rdpgw:${{ github.ref_name }}
      - name: Update Docker Hub Description
        if: env.PUSH == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ github.repository_owner }}/rdpgw
          readme-filepath: ./dev/docker/docker-readme.md
